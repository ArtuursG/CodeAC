<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color & Font Style Guide</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🎨 Style Guide</h1>
    </header>

    <main>
      <!-- Color Swatches -->
      <section class="colors">
        <h2 class="color-heading">
          <span id="c">C</span><span id="oOne">o</span><span id="l">l</span><span id="o">o</span><span id="r">r</span><span id="s">s</span>
        </h2>

        <div class="color-group">
          <h3 class="swatch-label" style="color: red">Red</h3>
          <div class="swatch-row">
            <div class="swatch redone"></div>
            <div class="swatch redtwo"></div>
            <div class="swatch redthree"></div>
          </div>

          <h3 class="swatch-label" style="color: green">Green</h3>
          <div class="swatch-row">
            <div class="swatch greenone"></div>
            <div class="swatch greentwo"></div>
            <div class="swatch greenthree"></div>
          </div>

          <h3 class="swatch-label" style="color: blue">Blue</h3>
          <div class="swatch-row">
            <div class="swatch blueone"></div>
            <div class="swatch bluetwo"></div>
            <div class="swatch bluethree"></div>
          </div>
        </div>
      </section>

      <!-- Fonts -->
      <section id="fonts">
        <h2>Typography</h2>
        <div class="font-panel">
          <p class="font-sample heading">Heading Example - 72px</p>
          <p class="font-sample subheading">Subheading Example - 36px</p>
          <p class="font-sample paragraph">Body Text Example - 18px</p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 Style Guide Project</p>
    </footer>
  </body>
</html>
